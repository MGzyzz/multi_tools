name: CI (Django / Poetry)

on:
    pull_request:
    push:
        branches: ["main"]

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        services:
            postgres:
                image: pgvector/pgvector:pg16
                env:
                    POSTGRES_DB: ai_bot_diplom_test
                    POSTGRES_USER: admin
                    POSTGRES_PASSWORD: admin
                ports:
                    - 5432:5432
                options: >-
                    --health-cmd="pg_isready -U admin -d ai_bot_diplom_test"
                    --health-interval=10s
                    --health-timeout=5s
                    --health-retries=5

        steps:
            - uses: actions/checkout@v4

            - name: Set up Python 3.11.7
              uses: actions/setup-python@v5
              with:
                  python-version: "3.11.7"

            - name: Install Poetry
              run: |
                  curl -sSL https://install.python-poetry.org | python3 -
                  echo "$HOME/.local/bin" >> $GITHUB_PATH

            - name: Install dependencies (back_end)
              working-directory: back_end
              run: |
                  poetry install --no-interaction --no-ansi --no-root

            - name: Prepare database (pgvector)
              env:
                  PGPASSWORD: admin
              run: |
                  psql -h localhost -U admin -d ai_bot_diplom_test -c "CREATE EXTENSION IF NOT EXISTS vector;"

            - name: Ruff (back_end)
              working-directory: back_end
              run: |
                  poetry run ruff check .
                  poetry run ruff format --check .

            - name: Django tests (back_end)
              working-directory: back_end
              env:
                  DATABASE_NAME: ai_bot_diplom_test
                  DATABASE_USER: admin
                  DATABASE_PASSWORD: admin
                  DATABASE_HOST: localhost
                  DATABASE_PORT: 5432
              run: |
                  poetry run python manage.py test
