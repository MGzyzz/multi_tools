<!DOCTYPE html>
<html lang="ru">
<body style="margin:0;padding:0;background:#f5f1ea;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f5f1ea;padding:28px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="640" cellspacing="0" cellpadding="0" style="width:640px;max-width:100%;background:#ffffff;border:1px solid #e3d7c8;border-radius:20px;overflow:hidden;">
          <tr>
            <td style="padding:24px 28px;background:#17324d;color:#fffaf3;font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:1.2;">
              {{ title }}
            </td>
          </tr>
          <tr>
            <td style="padding:28px;font-family:'Trebuchet MS','Segoe UI',sans-serif;font-size:16px;line-height:1.7;color:#29465f;white-space:pre-line;">
              {{ message }}
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
