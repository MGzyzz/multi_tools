[tool.poetry]
name = "remember-back-end"
version = "0.1.0"
description = ""
authors = ["Madi <madi_gaziz@mail.ru>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
django = "^5.2"
django-rest-framework = "^0.1.0"
black = "^25.1.0"
aiogram = "^3.20.0"
fastapi = "^0.115.12"
uvicorn = "^0.34.1"
websockets = "^13.1"
requests = "^2.32.3"
pip = "^25.0.1"
python-dotenv = "^1.1.0"
django-cors-headers = "^4.7.0"
pillow = "^11.2.1"
drf-yasg = "^1.21.10"
openpyxl = "^3.1.5"
psycopg2-binary = "^2.9.11"
djangorestframework-simplejwt = "^5.5.1"
django-celery-beat = "^2.8.1"
django-celery-results = "^2.6.0"
channels = "^4.2.2"
channels-redis = "^4.2.1"
colorlog = "^6.10.1"
redis = "^7.1.0"
ruff = "^0.14.14"
pgvector = "^0.4.2"


[tool.poetry.group.dev.dependencies]
ruff = "^0.14.14"
pre-commit = "^4.5.1"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"
fix = false

[tool.ruff.lint]
select = [
  "E",  # pycodestyle errors
  "F",  # pyflakes
  "I",  # imports (isort replacement)
  "B",  # bugbear (частые баги)
]

ignore = [
  "E501",  # длина строки — форматер решает
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
